[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-controls"
version = "0.1.0"
description = "A dynamic strategic model of US export controls on AI chips, HBM and SME to China."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-controls = "ai_controls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
