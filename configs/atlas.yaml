  national: {label: US security, usEconomy: 0.8, cnEconomy: 0.03, spillovers: 0.17, openness: 0.15, lead: 1.2, war: 0.9, catastrophe: 1}
  pluralist: {label: Pluralism, usEconomy: 0.25, cnEconomy: 0.25, spillovers: 0.5, openness: 1.3, lead: 0.05, war: 1, catastrophe: 1}
