  chipFlow: 2.10
  exportShare: 0.55
  chipGrowth: 0.10
  fabFlow: 0.90
  fabGrowth: 0.095
  equipmentDrag: 0.86
  memoryDrag: 0.73
  domesticQuality: 0.60
