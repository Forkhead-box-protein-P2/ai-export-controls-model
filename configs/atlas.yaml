  knowledgeDecay: 0.015
  experienceScale: 2
  computeElasticity: 0.36
  openCatchup: 0.13
  adaptiveThreshold: 0.68
  adaptiveSlope: 2.5
behavior:
  lookahead: 4
  temperature: 0.10
  sovereignty: 0.20
  strategicBelief: 0.42
  signal: 0.25
  security: 0.65
  investmentCost: 0.14
