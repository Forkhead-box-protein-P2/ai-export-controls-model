title: The export controls game
status: illustrative
description: All quantities, behavioral coefficients, world weights and value judgments are illustrative. Historical sources motivate mechanisms only.
start: 2026
end: 2050
defaults: {policy: selective, reference: broad, scenario: contested, lens: global, year: 2040}
# Policy dimensions are intensities on [0,1]. Enforcement multiplies the four restrictions.
policies:
  strict: {label: Tight controls, chips: 0.95, hbm: 0.9, tools: 0.9, cloud: 0.8, enforcement: 0.94, note: Restrict finished chips, production inputs and rented compute.}
  chips: {label: License chips, chips: 0.18, hbm: 0.9, tools: 0.9, cloud: 0.8, enforcement: 0.94, note: Reopen finished-chip sales while retaining memory and equipment controls.}
  memory: {label: License chips + HBM, chips: 0.18, hbm: 0.18, tools: 0.9, cloud: 0.8, enforcement: 0.94, note: Allow chip and memory sales while keeping equipment restrictions tight.}
  selective: {label: Selective licensing, chips: 0.55, hbm: 0.58, tools: 0.78, cloud: 0.35, enforcement: 0.84, note: License some buyers and quantities while limiting manufacturing inputs.}
  broad: {label: Broad licensing, chips: 0.1, hbm: 0.1, tools: 0.1, cloud: 0.1, enforcement: 0.7, note: Ease restrictions across chips, memory, equipment and cloud services.}
  adaptive: {label: Adaptive controls, chips: 0.35, hbm: 0.50, tools: 0.65, cloud: 0.3, enforcement: 0.88, note: Tighten chip and cloud access as China's prior-year frontier capability approaches US capability.}
responses:
  market: {label: Buy on price, mandate: 0.12, investment: 0.16, bypass: 0.12, note: Buyers favor immediately usable foreign chips when they are available.}
  build: {label: Build at home, mandate: 0.84, investment: 0.91, bypass: 0.15, note: Procurement mandates and investment support domestic producers and software.}
  route: {label: Route around, mandate: 0.30, investment: 0.32, bypass: 0.88, note: Buyers spend more on intermediaries and remote computing services.}
outcomes:
  ongoing: {label: No transition yet, note: The transformative capability threshold has yet to be reached by this year.}
  shared: {label: Shared frontier, note: A transition occurred and capabilities diffused without an exclusive strategic lead.}
  transient: {label: Temporary lead, note: A transition created a short-lived advantage or a formerly durable lead expired.}
  us: {label: Durable US lead, note: The US gained an exclusive advantage at transition and still holds it in this year.}
  cn: {label: Durable China lead, note: China gained an exclusive advantage at transition and still holds it in this year.}
scenario_controls:
  timing: {label: Transition half-time, unit: years, min: 3, max: 36, step: 1}
  lock: {label: Exclusive lead at arrival, unit: share, min: 0, max: 1, step: 0.05}
  learning: {label: Learning from domestic use, unit: gain, min: 0, max: 1.6, step: 0.05}
  persistence: {label: Lead half-life, unit: years, min: 1, max: 30, step: 1}
  friction: {label: Escalation vs. deterrence, unit: balance, min: -1, max: 1, step: 0.05}
scenarios:
  contested: {label: Contested frontier, timing: 15, lock: 0.55, learning: 0.75, persistence: 12, friction: 0.10}
  diffusion: {label: Rapid diffusion, timing: 24, lock: 0.2, learning: 1.25, persistence: 4, friction: 0.65}
  race: {label: Decisive race, timing: 7, lock: 0.9, learning: 0.2, persistence: 25, friction: -0.65}
# Alternative industrial environments, jointly varying domestic fab productivity and diffusion.
worlds:
  - {label: Difficult substitution, weight: 0.25, fab: 0.68, diffusion: 0.70}
  - {label: Middle case, weight: 0.5, fab: 1.0, diffusion: 1.0}
  - {label: Strong substitution, weight: 0.25, fab: 1.4, diffusion: 1.30}
initial: {usStock: 6, localStock: 0.7, importStock: 1.6, knowledge: 0.55, experience: 3, ratio: 0.72}
